# 数据库连接（复制为 application.properties 并按本地环境修改）
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/nep?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# 建议通过环境变量注入（见 .env.example）；也可直接写本地密码（该文件不入库）
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}

# 日志
logging.level.org.nep.nepsystem=info

# 模拟数据源（接入真实硬件时置 enabled=false）
simulator.enabled=true
simulator.interval-ms=5000

# 文件上传（BUG-002 修复）：单文件 5MB / 总请求 6MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB