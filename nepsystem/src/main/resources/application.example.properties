# 数据库连接（复制为 application.properties 并按本地环境修改）
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/nep?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# 日志
logging.level.org.nep.nepsystem=info

# 模拟数据源（接入真实硬件时置 enabled=false）
simulator.enabled=true
simulator.interval-ms=5000
